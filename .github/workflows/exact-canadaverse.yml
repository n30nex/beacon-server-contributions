name: Qualify exact Canadaverse sources
on:
  push:
    branches: [codex/canadaverse-builds-20261126]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server:
    if: github.repository == 'n30nex/beacon-server-contributions'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MeshCore-Beacon/beacon-server
          ref: 5fb32926f71998e9080190b84dc75eca2dd09f6d
          persist-credentials: false
      - name: Build the upstream Dockerfile for the Pi
        shell: bash
        run: |
          set -euo pipefail
          rev=$(git rev-parse HEAD)
          test "$rev" = 5fb32926f71998e9080190b84dc75eca2dd09f6d
          test -z "$(git status --porcelain)"
          out="$RUNNER_TEMP/exact-server"; mkdir "$out"
          tag="beacon-exact-preview:$rev"
          docker build --pull --platform linux/arm64 -t "$tag" --label "org.opencontainers.image.revision=$rev" --label "org.opencontainers.image.source=https://github.com/MeshCore-Beacon/beacon-server" -f .build/Dockerfile .
          id=$(docker create "$tag"); docker cp "$id:/app/beacon" "$RUNNER_TEMP/beacon"; docker rm "$id"
          docker save "$tag" | gzip -1 > "$out/server-image.tar.gz"
          git archive --format=tar HEAD -o "$out/server-source.tar"
          ARCHIVE_DIR="$out" IMAGE_TAG="$tag" python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          p=pathlib.Path(os.environ['ARCHIVE_DIR'])
          def sha(f):
              with f.open('rb') as h:return hashlib.file_digest(h,'sha256').hexdigest()
          def run(*args):return subprocess.check_output(args,text=True).strip()
          i=json.loads(run('docker','image','inspect',os.environ['IMAGE_TAG']))[0]
          assert i['Architecture']=='arm64' and i['Os']=='linux'
          s={'revision':run('git','rev-parse','HEAD'),'tree':run('git','rev-parse','HEAD^{tree}'),'image_id':i['Id'],'image_tag':os.environ['IMAGE_TAG'],'arch':i['Architecture'],'binary_sha256':sha(pathlib.Path(os.environ['RUNNER_TEMP'])/'beacon'),'archives':{f.name:sha(f) for f in p.iterdir()}}
          assert s['revision']==i['Config']['Labels']['org.opencontainers.image.revision']
          (p/'artifact.json').write_text(json.dumps(s,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: upstream-server-arm64
          path: ${{ runner.temp }}/exact-server/
          retention-days: 14
          if-no-files-found: error
  web:
    if: github.repository == 'n30nex/beacon-server-contributions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MeshCore-Beacon/beacon-web
          ref: 2fcac7cc27069d9c390167d96082a5d52cdd87de
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build for the Canadaverse subpath
        env:
          VITE_API_BASE: /beacon-dev/api/v1
          VITE_WS_URL: wss://canadaverse.org/beacon-dev/ws
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = 2fcac7cc27069d9c390167d96082a5d52cdd87de
          test -z "$(git status --porcelain)"
          npm run build -- --base=/beacon-dev/
          node .build/compress-assets.mjs dist/assets
          out="$RUNNER_TEMP/exact-web"; mkdir "$out"
          tar -C dist -cf "$out/web-dist.tar" .
          git archive --format=tar HEAD -o "$out/web-source.tar"
          ARCHIVE_DIR="$out" python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          p=pathlib.Path(os.environ['ARCHIVE_DIR']); dist=pathlib.Path('dist')
          def sha(f):
              with f.open('rb') as h:return hashlib.file_digest(h,'sha256').hexdigest()
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          m={'revision':git('rev-parse','HEAD'),'tree':git('rev-parse','HEAD^{tree}'),'version':json.loads(pathlib.Path('package.json').read_text())['version'],'base':'/beacon-dev/','environment':{k:os.environ[k] for k in ['VITE_API_BASE','VITE_WS_URL']},'assets':{f.relative_to(dist).as_posix():sha(f) for f in dist.rglob('*') if f.is_file()},'archives':{f.name:sha(f) for f in p.iterdir()}}
          (p/'artifact.json').write_text(json.dumps(m,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: upstream-web-preview
          path: ${{ runner.temp }}/exact-web/
          retention-days: 14
          if-no-files-found: error
  android:
    if: github.repository == 'n30nex/beacon-server-contributions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MeshCore-Beacon/beacon-flutter-app
          ref: b506a9d53115a224987a7e9a9d4dcb93084bfac3
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub --reporter expanded
      - run: flutter build apk --debug
      - name: Record the mobile source and APK
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = b506a9d53115a224987a7e9a9d4dcb93084bfac3
          test -z "$(git status --porcelain --untracked-files=no)"
          out="$RUNNER_TEMP/exact-android"; mkdir "$out"
          cp build/app/outputs/flutter-apk/app-debug.apk "$out/"
          git rev-parse HEAD > "$out/commit.txt"
          git rev-parse 'HEAD^{tree}' > "$out/tree.txt"
          (cd "$out" && sha256sum app-debug.apk > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: upstream-android-debug
          path: ${{ runner.temp }}/exact-android/
          retention-days: 14
          if-no-files-found: error
